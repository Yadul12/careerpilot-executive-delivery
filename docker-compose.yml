version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentiq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-talentiq_enterprise}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-talentiq} -d ${POSTGRES_DB:-talentiq_enterprise}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentiq_careerpilot_app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-talentiq}:${POSTGRES_PASSWORD:-talentiq_secret}@postgres:5432/${POSTGRES_DB:-talentiq_enterprise}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  fastapi-nlp-service:
    image: python:3.11-slim
    container_name: talentiq_fastapi_nlp
    working_dir: /srv
    volumes:
      - ./backend:/srv
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talentiq}:${POSTGRES_PASSWORD:-talentiq_secret}@postgres:5432/${POSTGRES_DB:-talentiq_enterprise}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
