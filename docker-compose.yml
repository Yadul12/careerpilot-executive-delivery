version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careerpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-careerpilot}
      POSTGRES_USER: ${SQL_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${SQL_ADMIN_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-fastapi:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: careerpilot-fastapi
    restart: unless-stopped
    environment:
      SQL_HOST: postgres
      SQL_DB_NAME: ${SQL_DB_NAME:-careerpilot}
      SQL_USER: ${SQL_USER:-postgres}
      SQL_PASSWORD: ${SQL_PASSWORD:-postgres}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-enterprise-jwt-secret-change-in-prod}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerpilot-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SQL_HOST: postgres
      SQL_DB_NAME: ${SQL_DB_NAME:-careerpilot}
      SQL_USER: ${SQL_USER:-postgres}
      SQL_PASSWORD: ${SQL_PASSWORD:-postgres}
      SQL_ADMIN_USER: ${SQL_ADMIN_USER:-postgres}
      SQL_ADMIN_PASSWORD: ${SQL_ADMIN_PASSWORD:-postgres}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
